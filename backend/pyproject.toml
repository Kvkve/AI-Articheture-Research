[project]
name = "backend"
version = "0.1.0"
description = "Backend of the AI agent platform proof of concept."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

# The tool settings below also cover the Python files in ../scripts.
# scripts/check.sh passes this file to the tools, so there is one copy of the rules.

[tool.ruff.lint]
# The defaults are E4, E7, E9 and F. "extend-select" keeps them and adds more.
# ERA001, FIX and BLE001 turn rules in AGENTS.md into checks:
# no commented-out code, no TODO markers, no catching of every exception.
extend-select = ["I", "B", "UP", "ERA001", "FIX", "BLE001", "S"]

[tool.ruff.lint.isort]
# Ruff runs from the repository root, so it cannot guess which modules are ours.
known-first-party = ["app", "check_architecture", "check_document_map", "stop_hook"]

[tool.ruff.lint.per-file-ignores]
# Tests use plain assert statements; pytest relies on them.
"**/tests/*.py" = ["S101"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
# The backend has no installed package, so pytest needs these folders on the import path.
pythonpath = [".", "../scripts"]
testpaths = ["tests", "../scripts/tests"]
